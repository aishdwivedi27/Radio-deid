# Local hooks only: they run the tools from the project venv, so nothing is downloaded at commit time.
# Install once with: python -m pre_commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: python -m ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: secret-scan
        name: secret scan (detect-secrets)
        entry: python tools/check_secrets.py
        language: system
        pass_filenames: false
      - id: synthetic-markers
        name: synthetic markers on committed DICOM
        entry: python tools/check_synthetic_markers.py
        language: system
        files: '\.dcm$'
      - id: layers
        name: layer import rules
        entry: python tools/check_layers.py
        language: system
        pass_filenames: false
        files: '^app/'
      - id: file-size
        name: file size
        entry: python tools/check_file_size.py
        language: system
        pass_filenames: false
